title: Evan Krocker
description: Personal blog covering web development, DevOps, and software engineering.
url: ""
baseurl: ""

author:
  name: Evan Krocker
  email: ekrocker@gmail.com

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Pagination (homepage)
paginate: 6
paginate_path: "/page/:num/"

# Plugins
plugins:
  - jekyll-archives
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag

# Category archive pages → /category/:name/
jekyll-archives:
  enabled:
    - categories
  layout: category
  permalinks:
    category: "/category/:name/"

# Code highlighting
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Category display labels and badge colors
category_meta:
  javascript:
    label: JavaScript
    color: "#f7df1e"
    text_color: "#1a1a1a"
  css:
    label: CSS
    color: "#264de4"
    text_color: "#ffffff"
  devops:
    label: DevOps
    color: "#0ea5e9"
    text_color: "#ffffff"
  python:
    label: Python
    color: "#3776ab"
    text_color: "#ffffff"
  databases:
    label: Databases
    color: "#336791"
    text_color: "#ffffff"

# Exclude Node.js app files from Jekyll build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package.json
  - package-lock.json
  - server.js
  - routes/
  - views/
  - data/
  - public/
  - "*.log"
  - .env
