<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body class="bg-light">
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Add Bootstrap classes to elements rendered from Markdown
    (function () {
      var content = document.querySelector('.post-content');
      if (!content) return;

      // Tables → Bootstrap table inside a responsive wrapper
      content.querySelectorAll('table').forEach(function (t) {
        t.classList.add('table', 'table-bordered', 'table-striped', 'table-hover', 'align-middle');
        var wrap = document.createElement('div');
        wrap.className = 'table-responsive my-4';
        t.parentNode.insertBefore(wrap, t);
        wrap.appendChild(t);
      });

      // Images → responsive + rounded
      content.querySelectorAll('img').forEach(function (img) {
        img.classList.add('img-fluid', 'rounded', 'my-3');
      });

      // Blockquotes → Bootstrap blockquote style
      content.querySelectorAll('blockquote').forEach(function (bq) {
        bq.classList.add(
          'blockquote', 'border-start', 'border-primary', 'border-4',
          'ps-4', 'py-1', 'my-4', 'text-secondary', 'fst-italic'
        );
      });
    })();
  </script>
</body>
</html>
